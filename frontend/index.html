<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>信息科技学习平台</title>
    <style>
      /* 首屏骨架：HTML 到达即显示，避免主 JS 下载期间白屏 */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f6fa;
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: #646a73;
        font-size: 15px;
      }
      #boot-skeleton .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #d9dde3;
        border-top-color: #2f6fed;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #16181d;
        }
        #boot-skeleton {
          color: #9aa4b2;
        }
        #boot-skeleton .boot-spinner {
          border-color: #333a45;
          border-top-color: #5b8def;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-skeleton">
        <div class="boot-spinner"></div>
        <div>正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
