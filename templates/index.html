<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 學習平台 - 學生登入</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: slideInDown 0.8s ease-out;
        }

        .header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            animation: slideInDown 0.8s ease-out 0.2s both;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 
                        0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: slideInUp 0.8s ease-out 0.4s both;
            transition: all 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-header h2 i {
            color: #667eea;
        }

        .form-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1rem;
            z-index: 1;
        }

        input[type="text"], 
        input[type="password"], 
        select {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus, 
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        select {
            cursor: pointer;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23999" stroke-width="2"><polyline points="6,9 12,15 18,9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
            appearance: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #36d1dc 0%, #5b86e5 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(54, 209, 220, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(54, 209, 220, 0.4);
        }

        .toggle-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .toggle-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .toggle-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .toggle-link:hover::after {
            width: 100%;
        }

        .hidden {
            display: none;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .main-container {
                margin: 15px;
                max-width: 100%;
            }

            .form-card {
                padding: 30px 25px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }

        /* 动画效果 */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        /* 加载状态 */
        .btn.loading {
            pointer-events: none;
            position: relative;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 美化滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 页面标题 -->
        <div class="header">
            <h1><i class="fab fa-python"></i> Python 學習平台</h1>
            <p class="subtitle">開啟你的程式設計之旅</p>
        </div>

        <!-- 学生登入表單 -->
        <div id="loginContainer" class="form-card">
            <div class="form-header">
                <h2><i class="fas fa-graduation-cap"></i> 學生登入</h2>
                <p>歡迎回到學習平台！請輸入你的學習資訊</p>
            </div>
            
            <form action="/login" method="post" id="loginForm">
                <div class="form-group">
                    <label for="loginGrade">年級</label>
                    <div class="input-wrapper">
                        <i class="fas fa-layer-group"></i>
                        <select id="loginGrade" name="grade" required>
                            <option value="">請選擇年級</option>
                            <option value="七年級">七年級</option>
                            <option value="八年級">八年級</option>
                            <option value="九年級">九年級</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginClass">班級</label>
                    <div class="input-wrapper">
                        <i class="fas fa-users"></i>
                        <select id="loginClass" name="class_num" required>
                            <option value="">請選擇班級</option>
                            <option value="1">1班</option>
                            <option value="2">2班</option>
                            <option value="3">3班</option>
                            <option value="4">4班</option>
                            <option value="5">5班</option>
                            <option value="6">6班</option>
                            <option value="7">7班</option>
                            <option value="8">8班</option>
                            <option value="9">9班</option>
                            <option value="10">10班</option>
                            <option value="11">11班</option>
                            <option value="12">12班</option>
                            <option value="13">13班</option>
                            <option value="14">14班</option>
                            <option value="15">15班</option>
                            <option value="16">16班</option>
                            <option value="17">17班</option>
                            <option value="18">18班</option>
                            <option value="19">19班</option>
                            <option value="20">20班</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginUsername">姓名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" name="username" required 
                               placeholder="請輸入你的姓名">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginStudentNumber">學號</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-badge"></i>
                        <select id="loginStudentNumber" name="student_number" required>
                            <option value="">請選擇學號（1-50）</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">密碼</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" name="password" required 
                               placeholder="請輸入密碼">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> 登入學習
                </button>
            </form>
            
            <div class="toggle-section">
                <p>還沒有帳號？<span class="toggle-link" onclick="showRegister()">立即註冊</span></p>
            </div>
        </div>

        <!-- 学生註冊表單 -->
        <div id="registerContainer" class="form-card hidden">
            <div class="form-header">
                <h2><i class="fas fa-user-plus"></i> 學生註冊</h2>
                <p>加入我們的學習平台，開始你的程式設計之旅！</p>
            </div>
            
            <form action="/register" method="post" id="registerForm">
                <div class="form-group">
                    <label for="registerGrade">年級</label>
                    <div class="input-wrapper">
                        <i class="fas fa-layer-group"></i>
                        <select id="registerGrade" name="grade" required>
                            <option value="">請選擇年級</option>
                            <option value="七年級">七年級</option>
                            <option value="八年級">八年級</option>
                            <option value="九年級">九年級</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerClass">班級</label>
                    <div class="input-wrapper">
                        <i class="fas fa-users"></i>
                        <select id="registerClass" name="class_num" required>
                            <option value="">請選擇班級</option>
                            <option value="1">1班</option>
                            <option value="2">2班</option>
                            <option value="3">3班</option>
                            <option value="4">4班</option>
                            <option value="5">5班</option>
                            <option value="6">6班</option>
                            <option value="7">7班</option>
                            <option value="8">8班</option>
                            <option value="9">9班</option>
                            <option value="10">10班</option>
                            <option value="11">11班</option>
                            <option value="12">12班</option>
                            <option value="13">13班</option>
                            <option value="14">14班</option>
                            <option value="15">15班</option>
                            <option value="16">16班</option>
                            <option value="17">17班</option>
                            <option value="18">18班</option>
                            <option value="19">19班</option>
                            <option value="20">20班</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerUsername">姓名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" name="username" required 
                               placeholder="請輸入你的真實姓名">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerStudentNumber">學號</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-badge"></i>
                        <select id="registerStudentNumber" name="student_number" required>
                            <option value="">請選擇學號（1-50）</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">密碼</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" name="password" required 
                               placeholder="請設定登入密碼" minlength="1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">確認密碼</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock-open"></i>
                        <input type="password" id="confirmPassword" name="confirm_password" required 
                               placeholder="請再次輸入密碼">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-secondary">
                    <i class="fas fa-rocket"></i> 開始學習
                </button>
            </form>
            
            <div class="toggle-section">
                <p>已有帳號？<span class="toggle-link" onclick="showLogin()">返回登入</span></p>
            </div>
        </div>
    </div>

    <script>
        // 表单切换函数
        function showRegister() {
            const loginContainer = document.getElementById('loginContainer');
            const registerContainer = document.getElementById('registerContainer');
            
            loginContainer.classList.add('fade-out');
            setTimeout(() => {
                loginContainer.classList.add('hidden');
                loginContainer.classList.remove('fade-out');
                registerContainer.classList.remove('hidden');
                registerContainer.classList.add('fade-in');
                setTimeout(() => {
                    registerContainer.classList.remove('fade-in');
                }, 500);
            }, 250);
        }
        
        function showLogin() {
            const loginContainer = document.getElementById('loginContainer');
            const registerContainer = document.getElementById('registerContainer');
            
            registerContainer.classList.add('fade-out');
            setTimeout(() => {
                registerContainer.classList.add('hidden');
                registerContainer.classList.remove('fade-out');
                loginContainer.classList.remove('hidden');
                loginContainer.classList.add('fade-in');
                setTimeout(() => {
                    loginContainer.classList.remove('fade-in');
                }, 500);
            }, 250);
        }

        // 表单提交加载状态
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '登入中...';
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('密碼與確認密碼不一致，請重新輸入！');
                return;
            }
            
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '註冊中...';
        });

        // 输入框焦点效果
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            document.body.style.opacity = '1';
            // 填充登录和注册页面的学号下拉（1-50）
            const selects = [document.getElementById('registerStudentNumber'), document.getElementById('loginStudentNumber')];
            selects.forEach(sel => {
                if (!sel) return;
                for (let i = 1; i <= 50; i++) {
                    const opt = document.createElement('option');
                    opt.value = i.toString();
                    opt.textContent = i.toString();
                    sel.appendChild(opt);
                }
            });
        });
    </script>
</body>
</html>
