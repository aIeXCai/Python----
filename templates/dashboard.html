<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 學習平台 - 學生答題</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .nav-brand i {
            color: #667eea;
            font-size: 1.8rem;
        }

        .nav-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 20px;
            color: #333;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        /* 主内容区 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* 左侧题目列表 */
        .problems-sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .sidebar-header h2 {
            color: #333;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i {
            color: #667eea;
        }

        .problems-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .problem-item {
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .problem-item:hover {
            background: rgba(102, 126, 234, 0.05);
            border-color: rgba(102, 126, 234, 0.2);
        }

        .problem-item.active {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        .problem-info h4 {
            color: #333;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .problem-info p {
            color: #666;
            font-size: 0.85rem;
        }

        .problem-status {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-attempted {
            background: #fff3cd;
            color: #856404;
        }

        .status-new {
            background: #e2e3e5;
            color: #383d41;
        }

        /* 右侧答题区域 */
        .answer-area {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .problem-header {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .problem-title {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .problem-title i {
            color: #667eea;
        }

        .problem-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-item i {
            color: #667eea;
        }

        /* 题目内容 */
        .problem-content {
            margin-bottom: 30px;
        }

        .content-section {
            margin-bottom: 25px;
        }

        .content-section h3 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-section h3 i {
            color: #667eea;
        }

        .problem-description {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .test-cases {
            display: grid;
            gap: 15px;
        }

        .test-case {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e9ecef;
        }

        .test-case h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .io-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .io-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .io-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .io-content {
            font-family: 'Courier New', monospace;
            background: #f1f3f4;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #333;
            white-space: pre-wrap;
        }

        /* 提交区域 */
        .submit-section {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px dashed rgba(102, 126, 234, 0.3);
        }

        .submit-header {
            margin-bottom: 20px;
        }

        .submit-header h3 {
            color: #333;
            font-size: 1.4rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submit-header h3 i {
            color: #667eea;
        }

        .submit-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .upload-area {
            position: relative;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: white;
            border: 2px dashed #667eea;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #667eea;
            font-weight: 500;
        }

        .file-input-label:hover {
            background: rgba(102, 126, 234, 0.05);
            border-color: #5a67d8;
        }

        .file-input-label i {
            font-size: 1.5rem;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 提交历史 */
        .submission-history {
            margin-top: 30px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .history-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-header h4 {
            color: #333;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header h4 i {
            color: #667eea;
        }

        .submission-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f8f9fa;
        }

        .submission-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .submission-score {
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .score-excellent {
            background: #d4edda;
            color: #155724;
        }

        .score-good {
            background: #d1ecf1;
            color: #0c5460;
        }

        .score-fair {
            background: #fff3cd;
            color: #856404;
        }

        .score-poor {
            background: #f8d7da;
            color: #721c24;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 4rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .problems-sidebar {
                position: static;
                order: 2;
            }

            .answer-area {
                order: 1;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .io-group {
                grid-template-columns: 1fr;
            }
        }

        /* 加载和成功动画 */
        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fab fa-python"></i>
                Python 學習平台
            </div>
            <div class="nav-info">
                <div class="user-info">
                    <i class="fas fa-user"></i>
                    <span>{{USERNAME}}</span>
                    <span>({{GRADE}} {{CLASS}}班)</span>
                </div>
                <a href="/logout" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    登出
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 左侧题目列表 -->
        <div class="problems-sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-list-alt"></i>
                    練習題目
                </h2>
            </div>
            <div class="problems-list" id="problemsList">
                {{PROBLEMS_LIST}}
            </div>
        </div>

        <!-- 右侧答题区域 -->
        <div class="answer-area">
            <div id="welcomeScreen">
                <div class="empty-state">
                    <i class="fas fa-hand-point-left"></i>
                    <h3>選擇一個題目開始答題</h3>
                    <p>從左側選擇一個題目，查看題目要求並上傳你的 Python 程式碼</p>
                </div>
            </div>

            <div id="problemView" style="display: none;">
                <!-- 题目标题 -->
                <div class="problem-header">
                    <h1 class="problem-title" id="problemTitle">
                        <i class="fas fa-puzzle-piece"></i>
                        <span>選擇題目...</span>
                    </h1>
                    <div class="problem-meta">
                        <div class="meta-item">
                            <i class="fas fa-upload"></i>
                            <span>檔案格式：.py</span>
                        </div>
                    </div>
                </div>

                <!-- 题目内容 -->
                <div class="problem-content">
                    <div class="content-section">
                        <h3>
                            <i class="fas fa-file-alt"></i>
                            題目描述
                        </h3>
                        <div class="problem-description" id="problemDescription">
                            請從左側選擇一個題目查看詳細描述...
                        </div>
                    </div>

                    <div class="content-section">
                        <h3>
                            <i class="fas fa-vial"></i>
                            測試案例
                        </h3>
                        <div class="test-cases" id="testCases">
                            <!-- 测试案例将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 提交区域 -->
                <div class="submit-section">
                    <div class="submit-header">
                        <h3>
                            <i class="fas fa-cloud-upload-alt"></i>
                            提交你的程式碼
                        </h3>
                        <p>請上傳你的 Python 程式碼檔案 (.py)，系統將自動執行測試並給出成績。</p>
                    </div>

                    <form id="submitForm" action="/submit_code" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="problem_id" id="currentProblemId" value="">
                        
                        <div class="upload-area">
                            <div class="file-input-wrapper">
                                <input type="file" id="codeFile" name="codeFile" accept=".py" required>
                                <label for="codeFile" class="file-input-label">
                                    <i class="fas fa-file-upload"></i>
                                    <span>點擊選擇 Python 檔案</span>
                                </label>
                            </div>
                            <div class="file-info" id="fileInfo">
                                <div class="file-name" id="fileName"></div>
                                <div class="file-size" id="fileSize"></div>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn" disabled>
                            <i class="fas fa-rocket"></i>
                            <span>提交程式碼</span>
                            <i class="fas fa-spinner loading" id="loadingIcon"></i>
                        </button>
                    </form>

                    <div class="success-message" id="successMessage">
                        <i class="fas fa-check-circle"></i>
                        程式碼提交成功！正在進行自動批改...
                    </div>

                    <div class="error-message" id="errorMessage">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span id="errorText">提交失敗，請重試。</span>
                    </div>
                </div>

                <!-- 提交历史 -->
                <div class="submission-history">
                    <div class="history-header">
                        <h4>
                            <i class="fas fa-history"></i>
                            提交歷史
                        </h4>
                    </div>
                    <div id="submissionList">
                        <p style="color: #666; text-align: center; padding: 20px;">暫無提交記錄</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentProblem = null;
        let problems = {};

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadProblems();
            setupFileUpload();
            setupFormSubmit();
        });

        // 加载题目列表
        function loadProblems() {
            // 这里应该从服务器获取题目列表
            // 暂时使用模拟数据
            fetch('/api/problems')
                .then(response => response.json())
                .then(data => {
                    problems = data;
                    renderProblemsList(data);
                })
                .catch(error => {
                    console.error('Error loading problems:', error);
                });
        }

        // 渲染题目列表
        function renderProblemsList(problemsData) {
            const problemsList = document.getElementById('problemsList');
            if (!problemsData || problemsData.length === 0) {
                problemsList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">暫無題目</p>';
                return;
            }

            problemsList.innerHTML = problemsData.map(problem => `
                <div class="problem-item" onclick="selectProblem('${problem.id}')">
                    <div class="problem-info">
                        <h4>${problem.title}</h4>
                    </div>
                    <div class="problem-status ${problem.status || 'status-new'}">${getStatusText(problem.status)}</div>
                </div>
            `).join('');
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'status-completed': return '已完成';
                case 'status-attempted': return '已嘗試';
                default: return '未開始';
            }
        }

        // 选择题目
        function selectProblem(problemId) {
            // 更新选中状态
            document.querySelectorAll('.problem-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // 加载题目详情
            loadProblemDetails(problemId);
        }

        // 加载题目详情
        function loadProblemDetails(problemId) {
            fetch(`/api/problem/${problemId}`)
                .then(response => response.json())
                .then(data => {
                    currentProblem = data;
                    renderProblemDetails(data);
                    loadSubmissionHistory(problemId);
                })
                .catch(error => {
                    console.error('Error loading problem details:', error);
                });
        }

        // 渲染题目详情
        function renderProblemDetails(problem) {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('problemView').style.display = 'block';

            document.getElementById('problemTitle').innerHTML = `
                <i class="fas fa-puzzle-piece"></i>
                <span>${problem.title}</span>
            `;
            
            document.getElementById('problemDescription').textContent = problem.description;
            document.getElementById('currentProblemId').value = problem.id;

            // 渲染测试案例
            const testCasesContainer = document.getElementById('testCases');
            if (problem.testCases && problem.testCases.length > 0) {
                testCasesContainer.innerHTML = problem.testCases.map((testCase, index) => `
                    <div class="test-case">
                        <h4>測試案例 ${index + 1}</h4>
                        <div class="io-group">
                            <div class="io-item">
                                <div class="io-label">輸入</div>
                                <div class="io-content">${testCase.input}</div>
                            </div>
                            <div class="io-item">
                                <div class="io-label">預期輸出</div>
                                <div class="io-content">${testCase.output}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                testCasesContainer.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">暫無測試案例</p>';
            }

            // 重置上传状态
            resetUploadState();
        }

        // 设置文件上传
        function setupFileUpload() {
            const fileInput = document.getElementById('codeFile');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const submitBtn = document.getElementById('submitBtn');

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    if (!file.name.endsWith('.py')) {
                        alert('請選擇 Python 檔案 (.py)');
                        fileInput.value = '';
                        return;
                    }

                    fileName.textContent = file.name;
                    fileSize.textContent = `檔案大小: ${(file.size / 1024).toFixed(1)} KB`;
                    fileInfo.classList.add('show');
                    submitBtn.disabled = false;
                } else {
                    fileInfo.classList.remove('show');
                    submitBtn.disabled = true;
                }
            });
        }

        // 设置表单提交
        function setupFormSubmit() {
            const form = document.getElementById('submitForm');
            const submitBtn = document.getElementById('submitBtn');
            const loadingIcon = document.getElementById('loadingIcon');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!currentProblem) {
                    alert('請先選擇一個題目');
                    return;
                }

                // 显示加载状态
                submitBtn.disabled = true;
                loadingIcon.classList.add('show');
                submitBtn.querySelector('span').textContent = '提交中...';
                
                // 隐藏之前的消息
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';

                // 提交表单
                const formData = new FormData(form);
                
                fetch('/submit_code', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        successMessage.style.display = 'block';
                        form.reset();
                        resetUploadState();
                        // 重新加载提交历史
                        setTimeout(() => {
                            loadSubmissionHistory(currentProblem.id);
                        }, 1000);
                    } else {
                        errorMessage.style.display = 'block';
                        document.getElementById('errorText').textContent = data.message || '提交失敗，請重試。';
                    }
                })
                .catch(error => {
                    console.error('Submit error:', error);
                    errorMessage.style.display = 'block';
                    document.getElementById('errorText').textContent = '網路錯誤，請重試。';
                })
                .finally(() => {
                    // 恢复按钮状态
                    submitBtn.disabled = false;
                    loadingIcon.classList.remove('show');
                    submitBtn.querySelector('span').textContent = '提交程式碼';
                });
            });
        }

        // 重置上传状态
        function resetUploadState() {
            document.getElementById('fileInfo').classList.remove('show');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // 加载提交历史
        function loadSubmissionHistory(problemId) {
            fetch(`/api/submissions/${problemId}`)
                .then(response => response.json())
                .then(data => {
                    renderSubmissionHistory(data);
                })
                .catch(error => {
                    console.error('Error loading submission history:', error);
                });
        }

        // 渲染提交历史
        function renderSubmissionHistory(submissions) {
            const container = document.getElementById('submissionList');
            
            if (!submissions || submissions.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">暫無提交記錄</p>';
                return;
            }

            container.innerHTML = submissions.map(submission => `
                <div class="submission-item">
                    <div class="submission-info">
                        <span>${submission.fileName}</span>
                        <span style="color: #666; font-size: 0.9rem;">${submission.submitTime}</span>
                    </div>
                    <div class="submission-score ${getScoreClass(submission.score)}">
                        ${submission.score}分
                    </div>
                </div>
            `).join('');
        }

        // 获取分数样式类
        function getScoreClass(score) {
            if (score >= 90) return 'score-excellent';
            if (score >= 80) return 'score-good';
            if (score >= 60) return 'score-fair';
            return 'score-poor';
        }
    </script>
</body>
</html>
