<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>個人主頁</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: #f44336; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; }
        .logout-btn:hover { background-color: #da190b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>歡迎來到你的個人主頁！</h1>
        <a href="/logout" class="logout-btn">登出</a>
    </div>
    <p>在這裡，你可以提交你的 Python 程式碼，系統會自動批改並給你成績。</p>
    
    <hr>
    
    <h2>提交作業</h2>
    <form action="/submit_code" method="post" enctype="multipart/form-data">
        <label for="codeFile">請選擇你的 Python 程式碼檔案 (.py)：</label>
        <input type="file" id="codeFile" name="codeFile" accept=".py" required><br><br>
        <button type="submit">提交程式碼</button>
    </form>

</body>
</html>
