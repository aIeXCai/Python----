<div class="test-case-group">
    <h4>測試案例 {{CASE_NUMBER}}</h4>
    <div class="input-group">
        <label>輸入：</label>
        <textarea name="test_input_{{CASE_INDEX}}" placeholder="輸入數據">{{TEST_INPUT}}</textarea>
    </div>
    <div class="input-group">
        <label>預期輸出：</label>
        <textarea name="test_output_{{CASE_INDEX}}" placeholder="預期輸出">{{TEST_OUTPUT}}</textarea>
    </div>
    <button type="button" class="remove-test-case" onclick="removeTestCase(this)">移除此測試案例</button>
</div>
